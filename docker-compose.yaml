services:
    mysql:
        image: mysql:8.0
        container_name: my_loc_mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: my_loc_db
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret
        ports:
            - '3306:3306'
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - my_loc_network

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: my_loc_phpmyadmin
        restart: unless-stopped
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            PMA_USER: root
            PMA_PASSWORD: root
        ports:
            - '8080:80'
        depends_on:
            - mysql
        networks:
            - my_loc_network

volumes:
    mysql_data:
        driver: local

networks:
    my_loc_network:
        driver: bridge
